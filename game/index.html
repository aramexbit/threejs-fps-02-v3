<!DOCTYPE html>
<html lang="en">
<head>

<title>FROSTLINE — Ironworks Ridge</title>
<style>
  /* v3.15 HUD MILITARY TACTICAL (pengguna 16 Nov 10:08): panel abu-abu
     gelap transparan, teks putih, aksen oranye — ganti tema navy + emas
     OhMyGames. Semua class sama seperti sebelumnya (verify mengandalkan
     .buy/.overlay/.feed-item/.chat-item/.pips-sol/.slot) — hanya tampilan
     + posisi yang berubah, tidak ada info HUD yang dihilangkan.
     v3.16 Phase 2b (pengguna 16 Nov 14:28 "UI terlalu berat"): panel
     lebih transparan + ramping, blur dihapus, shadow dilembutkan, teks
     diberi text-shadow agar tetap terbaca di atas salju terang. */
  :root {
    --navy: rgba(13, 17, 22, .55);
    --navy-2: rgba(16, 20, 25, .82);
    --line: rgba(255, 255, 255, .10);
    --ink: #f4f6f8;
    --muted: #a7b0b8;
    --red: #e0352b;
    --red-bright: #ff4d42;
    --blue: #2f6fd8;
    --blue-bright: #4da3ff;
    --gold: #ff7a2f;
    --orange: #ff7a2f;
    --accent: #ff7a2f;
    --panel: rgba(13, 17, 22, .55);
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0d1117; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .hud { position: fixed; inset: 0; pointer-events: none; font-family: system-ui, sans-serif; color: var(--ink); }
  .hidden { display: none !important; }
  /* v3.15: transisi halus untuk semua panel HUD (opacity + transform). */
  .bl, .br, .score, .timer, .feed-item, .chat-item, .banner, .statusmsg, .plantprompt, .buy, .help, .settings { transition: opacity .2s ease, transform .2s ease; }
  /* Compass — top-centre, di atas score pill. Canvas 2D yang digambar
     hud.js tiap frame dari yaw pemain + posisi site/musuh (bukan statis). */
  .compass { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); }
  .compass canvas { display: block; width: 340px; height: 34px; }
  /* Minimap — v3.15 PINDAH ke kanan atas (tactical). */
  .minimap-wrap { position: absolute; top: 14px; right: 14px; }
  .minimap { width: 150px; height: 150px; border-radius: 50%; box-shadow: 0 0 0 3px rgba(255,122,47,.55), 0 2px 8px rgba(0,0,0,.30); background: #dfe6ec; }
  /* HP / ARMOR / CASH panel — v3.15 PINDAH ke kiri bawah (tactical).
     Angka HP besar + bar; aksen oranye; pulse merah saat HP rendah. */
  .bl { position: absolute; left: 16px; bottom: 16px; width: 240px; background: var(--navy); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 8px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.25); text-shadow: 0 1px 3px rgba(0,0,0,.55); }
  .bl.lowhp { animation: lowhp 1s infinite; }
  @keyframes lowhp { 0%, 100% { border-left-color: rgba(224,53,43,.5); } 50% { border-left-color: #e0352b; box-shadow: 0 0 18px rgba(224,53,43,.55); } }
  .hp-row, .armor-row, .money-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-weight: 800; }
  .row-label { letter-spacing: .04em; }
  .hp-label { color: #ff6b61; }
  .armor-label { color: #7fb3ff; }
  .cash-label { color: var(--gold); }
  .hpbar { width: 100%; height: 10px; background: rgba(255,255,255,.12); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin: 5px 0 7px; }
  .hpfill { height: 100%; width: 100%; background: #f4f6f8; transition: width .18s ease, background .18s ease; }
  .hptext, .armor-val { color: var(--ink); }
  .money { color: var(--gold); }
  /* Score bar — top-centre, di bawah compass. */
  .score { position: absolute; top: 48px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; font-weight: 800; letter-spacing: .06em; background: var(--navy); border: 1px solid var(--line); border-radius: 10px; padding: 6px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.25); text-shadow: 0 1px 3px rgba(0,0,0,.55); white-space: nowrap; }
  .score-sol { color: var(--red-bright); font-size: 15px; }
  .score-bas { color: var(--blue-bright); font-size: 15px; }
  .score-mid { color: var(--ink); font-size: 12px; opacity: .85; letter-spacing: .1em; }
  .timer { position: absolute; top: 94px; left: 50%; transform: translateX(-50%); font-size: 28px; font-weight: 900; background: var(--navy); border: 1px solid var(--line); border-radius: 10px; padding: 2px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.25); text-shadow: 0 1px 3px rgba(0,0,0,.55); }
  .timer.urgent { color: #ff5a4e; border-color: rgba(255,90,78,.7); }
  /* Mission objective — v3.15 PINDAH ke kiri atas: kartu objektif dengan
     label MISSION, bukan lagi pill emas di bawah timer. */
  .bomb-status { position: absolute; top: 14px; left: 14px; max-width: 320px; font-size: 13px; font-weight: 800; letter-spacing: .05em; line-height: 1.45; color: var(--ink); background: var(--navy); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 7px 11px; white-space: normal; text-shadow: 0 1px 3px rgba(0,0,0,.55); }
  .bomb-status::before { content: '◉ MISSION — '; color: var(--accent); }
  .bomb-status:empty { display: none; }
  /* Team alive pips — di bawah timer. */
  .pips { position: absolute; top: 142px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .pips-sol i, .pips-bas i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin: 0 2px; box-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .pips-sol i { background: var(--red-bright); } .pips-bas i { background: var(--blue-bright); }
  .pips-sol i.dead, .pips-bas i.dead { background: #3a4450; opacity: .55; }
  /* Kill feed — kanan atas, di bawah tombol gear/help (yang pindah ke
     bawah minimap). */
  .feed { position: absolute; top: 228px; right: 16px; text-align: right; font-size: 13px; font-weight: 600; }
  .feed-item { background: var(--navy); border: 1px solid var(--line); border-right: 3px solid var(--red-bright); padding: 5px 10px; margin-bottom: 5px; border-radius: 8px; animation: feedIn .18s ease; }
  @keyframes feedIn { from { opacity: 0; transform: translateX(12px); } }
  .feed-item.feed-hs { border-right-color: #ff2f2f; background: rgba(60,16,12,.70); }
  .feed-weapon { color: var(--gold); }
  .feed-hs-tag { color: #ff5a4e; font-weight: 800; }
  /* Team chat / radio — kiri bawah, di atas panel HP. */
  .chat { position: absolute; left: 16px; bottom: 148px; font-size: 13px; font-weight: 600; max-width: 430px; }
  .chat-item { background: var(--navy); border: 1px solid var(--line); border-left: 3px solid var(--red-bright); padding: 5px 10px; margin-bottom: 4px; border-radius: 8px; animation: feedIn .18s ease; }
  .chat-item.chat-bas { border-left-color: var(--blue-bright); }
  /* Flashbang overlay */
  .flashfx { position: absolute; inset: 0; background: #fff; opacity: 0; transition: opacity 1.2s; pointer-events: none; }
  /* Banner */
  .banner { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; font-weight: 900; letter-spacing: .08em; text-align: center; text-shadow: 0 3px 14px rgba(0,0,0,.9); color: var(--gold); white-space: nowrap; }
  /* v3.8 kill banners: HEADSHOT merah + multi-kill oranye, di kanan
     bawah kill feed (feed kini di 228px, jadi banner turun ke ~400px). */
  .killbanner { position: absolute; top: 400px; right: 16px; font-size: 26px; font-weight: 900; font-style: italic; letter-spacing: .02em; color: #fff; background: linear-gradient(100deg, rgba(190,20,20,.78), rgba(120,8,8,.70)); border: 1px solid rgba(255,90,78,.9); border-radius: 8px; padding: 8px 14px; transform: skewX(-6deg); text-shadow: 0 2px 8px rgba(0,0,0,.8); box-shadow: 0 2px 10px rgba(0,0,0,.35); white-space: nowrap; }
  .killbanner b { color: var(--gold); }
  .multibanner { position: absolute; top: 460px; right: 16px; font-size: 24px; font-weight: 900; font-style: italic; letter-spacing: .04em; color: #fff; background: linear-gradient(100deg, rgba(176,90,10,.78), rgba(110,50,5,.70)); border: 1px solid rgba(255,122,47,.9); border-radius: 8px; padding: 8px 18px; transform: skewX(-6deg); text-shadow: 0 2px 8px rgba(0,0,0,.8); box-shadow: 0 2px 10px rgba(0,0,0,.35); white-space: nowrap; }
  /* Crosshair — titik oranye di tengah + 4 garis putih. */
  .cross { position: absolute; left: 50%; top: 50%; width: 0; height: 0; --sp: 8px; }
  .cross::after { content: ''; position: absolute; left: -2px; top: -2px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 3px #000; }
  .cross i { position: absolute; background: rgba(244,246,248,.95); box-shadow: 0 0 3px #000; }
  .cross i:nth-child(1) { left: calc(-1px + var(--sp) * -1); top: -8px; width: 2px; height: 8px; }
  .cross i:nth-child(2) { left: calc(-1px + var(--sp)); top: -8px; width: 2px; height: 8px; }
  .cross i:nth-child(3) { top: calc(-1px + var(--sp) * -1); left: -8px; height: 2px; width: 8px; }
  .cross i:nth-child(4) { top: calc(-1px + var(--sp)); left: -8px; height: 2px; width: 8px; }
  .cross.ads i { opacity: .35; }
  .hitmarker { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; display: none; }
  /* v3.9 (DeepSeek): the hitmarker div had no visible shape at all — draw
     the X with two rotated bars; headshots show it in red. */
  .hitmarker::before, .hitmarker::after { content: ''; position: absolute; left: 10px; top: 0; width: 2px; height: 22px; background: #fff; box-shadow: 0 0 4px rgba(0,0,0,.8); }
  .hitmarker::before { transform: rotate(45deg); }
  .hitmarker::after { transform: rotate(-45deg); }
  .hitmarker.hs::before, .hitmarker.hs::after { background: #ff2f2f; }
  /* v3.15: hit indicator arah damage — 4 segmen arc di sekitar crosshair.
     Segmen yang menyala = arah datangnya tembakan (depan/kanan/belakang/
     kiri relatif terhadap arah hadap pemain). Disetel hud.js dari event
     damage (sim.js kirim posisi penembak). */
  .dmgdir { position: absolute; left: 50%; top: 50%; width: 140px; height: 140px; margin: -70px 0 0 -70px; pointer-events: none; }
  .dmg-arc { position: absolute; left: 50%; top: 50%; width: 46px; height: 9px; margin: -4px 0 0 -23px; border-radius: 6px; background: #ff3b30; box-shadow: 0 0 10px rgba(255,59,48,.9); opacity: 0; transition: opacity .5s ease; }
  .dmg-n { transform: translateY(-62px); }
  .dmg-e { transform: rotate(90deg) translateY(-62px); }
  .dmg-s { transform: rotate(180deg) translateY(-62px); }
  .dmg-w { transform: rotate(270deg) translateY(-62px); }
  /* Bottom-right ammo */
  .br { position: absolute; right: 20px; bottom: 14px; text-align: right; background: var(--navy); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.25); text-shadow: 0 1px 3px rgba(0,0,0,.55); }
  .slots { display: flex; gap: 5px; justify-content: flex-end; margin-bottom: 6px; }
  .slot { font-size: 11px; font-weight: 800; color: var(--muted); background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .slot-active { color: var(--gold); border-color: var(--gold); background: rgba(255,122,47,.18); }
  .slot-empty { opacity: .45; }
  .slot-bomb { color: var(--gold); border-color: var(--gold); }
  .ammo { font-size: 46px; font-weight: 900; line-height: 1; text-shadow: 0 3px 10px rgba(0,0,0,.85); }
  .ammo.bump { animation: ampop .15s ease; }
  @keyframes ampop { 50% { transform: scale(1.12); } }
  .ammo span { font-size: 22px; color: var(--muted); }
  .wname { font-size: 14px; font-weight: 700; color: var(--muted); margin-top: 2px; }
  .grenades { font-size: 13px; font-weight: 700; color: var(--gold); margin-top: 2px; }
  /* Channel */
  .channel { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); width: 300px; text-align: center; background: var(--navy); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; }
  .channelfill { height: 10px; background: linear-gradient(90deg, #ff9a4d, var(--gold)); border-radius: 999px; width: 0; }
  .channellabel { font-size: 13px; font-weight: 800; letter-spacing: .1em; margin-top: 5px; color: var(--gold); }
  .damagefx { position: absolute; inset: 0; box-shadow: inset 0 0 90px 30px rgba(224,60,50,.55); opacity: 0; transition: opacity .25s; }
  /* Buy menu */
  .buy-backdrop { position: absolute; inset: 0; background: rgba(6,10,18,.45); pointer-events: auto; }
  .buy { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 980px; max-width: 94vw; max-height: 94vh; overflow-y: auto; background: var(--navy-2); border: 1px solid var(--line); border-radius: 12px; padding: 20px; pointer-events: auto; box-shadow: 0 8px 24px rgba(0,0,0,.40); }
  .buy-head { display: flex; justify-content: space-between; align-items: baseline; }
  .buy-title { font-size: 22px; font-weight: 900; letter-spacing: .06em; color: var(--gold); margin-bottom: 4px; }
  .buy-money { font-size: 16px; font-weight: 800; color: var(--gold); margin-bottom: 10px; }
  .buy-squad { display: flex; gap: 6px; margin-bottom: 12px; }
  .buy-mate { flex: 1; background: rgba(255,255,255,.05); border: 1px solid var(--line); border-left: 3px solid var(--red-bright); border-radius: 8px; padding: 7px 9px; min-width: 0; }
  .buy-mate b { display: block; font-size: 12px; color: var(--ink); }
  .buy-mate span { font-size: 11px; color: var(--muted); }
  .buy-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }
  .buy-col { min-width: 0; }
  .buy-section { font-size: 12px; font-weight: 900; letter-spacing: .14em; color: var(--gold); margin: 10px 0 6px; }
  .buy-item { display: block; width: 100%; padding: 10px 12px; margin-bottom: 6px; background: #232a30; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; text-align: left; transition: border-color .12s, background .12s; }
  .buy-item:hover { border-color: var(--gold); background: #2e363d; }
  .buy-item.buy-owned { opacity: .55; }
  .buy-card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .buy-name { text-align: left; }
  .buy-stats { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 3px; }
  .buy-price { color: var(--gold); }
  .buy-foot { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .buy-hint { font-size: 12px; color: var(--muted); }
  /* Overlays */
  .overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,10,18,.70), rgba(6,10,18,.82)); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: auto; }
  /* v3.10: gear button + help button — v3.15 di bawah minimap (kanan atas),
     karena minimap pindah ke kanan atas. */
  .gearbtn { position: absolute; top: 178px; right: 16px; pointer-events: auto; background: var(--navy); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 13px; font-size: 13px; font-weight: 800; cursor: pointer; letter-spacing: .04em; }
  .gearbtn:hover { border-color: var(--gold); color: var(--gold); }
  /* v3.13: help button (next to gear), help panel, plant/defuse prompt,
     scoreboard, difficulty tag. */
  .helpbtn { position: absolute; top: 178px; right: 138px; pointer-events: auto; background: var(--navy); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 13px; font-size: 13px; font-weight: 800; cursor: pointer; letter-spacing: .04em; }
  .helpbtn:hover { border-color: var(--gold); color: var(--gold); }
  .help { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 640px; max-width: 92vw; max-height: 86vh; overflow: auto; background: var(--navy-2); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; pointer-events: auto; box-shadow: 0 8px 24px rgba(0,0,0,.40); z-index: 30; }
  .help-title { font-size: 20px; font-weight: 900; letter-spacing: .06em; color: var(--gold); margin-bottom: 12px; }
  .help-row { display: flex; gap: 12px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px; }
  .help-key { flex: 0 0 130px; font-weight: 900; color: var(--gold); }
  .help-desc { color: var(--ink); }
  .help-foot { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.5; }
  .help-close { display: block; margin: 16px auto 0; padding: 10px 28px; background: var(--gold); color: #0d1117; border: none; border-radius: 8px; font-size: 14px; font-weight: 900; letter-spacing: .06em; cursor: pointer; }
  /* Plant/defuse prompt — big gold pulse when an action is available. */
  .plantprompt { position: absolute; left: 50%; bottom: 30%; transform: translateX(-50%); font-size: 15px; font-weight: 800; letter-spacing: .05em; color: var(--gold); background: var(--navy); border: 1px solid rgba(255,210,74,.4); border-radius: 999px; padding: 7px 18px; white-space: nowrap; }
  .plantprompt-big { font-size: 24px; padding: 10px 24px; animation: pulse 1.2s infinite; border-color: var(--gold); box-shadow: 0 0 24px rgba(255,210,74,.35); }
  /* Difficulty tag under the top cluster. */
  .difftag { position: absolute; top: 172px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--muted); background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; white-space: nowrap; }
  .diff-line { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
  .diff-line b { color: var(--gold); }
  /* Scoreboard (end of match). */
  .sb-win { color: var(--gold) !important; }
  .sb-lose { color: #ff5a4e !important; }
  .sb-tables { display: flex; gap: 16px; margin: 14px 0 6px; max-width: 94vw; }
  .sb-team { background: var(--navy-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; min-width: 300px; }

  .settings { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 560px; max-width: 92vw; background: var(--navy-2); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; pointer-events: auto; box-shadow: 0 8px 24px rgba(0,0,0,.40); }
  .settings-title { font-size: 20px; font-weight: 900; letter-spacing: .06em; color: var(--gold); margin-bottom: 14px; }

  .settings-slider { flex: 1.4; accent-color: var(--gold); }
  .settings-value { width: 52px; text-align: right; font-size: 13px; font-weight: 800; color: var(--gold); }
  .settings-check { width: 18px; height: 18px; accent-color: var(--gold); }

  .settings-qbtn.q-active { border-color: var(--gold); background: rgba(255,122,47,.18); color: var(--gold); }
  .settings-foot { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .settings-close { display: block; margin: 16px auto 0; padding: 10px 28px; background: var(--gold); color: #0d1117; border: none; border-radius: 8px; font-size: 14px; font-weight: 900; letter-spacing: .06em; cursor: pointer; }
  .pause-btns { display: flex; gap: 12px; margin-top: 18px; }
  .pause-btn { padding: 10px 22px; background: #232a30; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font-size: 15px; font-weight: 800; cursor: pointer; }
  .pause-btn:hover { border-color: var(--gold); color: var(--gold); }
  .overlay h1 { font-size: 64px; letter-spacing: .14em; margin: 0; color: var(--ink); text-shadow: 0 4px 24px rgba(0,0,0,.8); }
  .overlay .sub { font-size: 17px; color: var(--gold); font-weight: 700; margin: 10px 0 4px; }
